<section id="hero" class="hero-section">
  <div class="container-custom">
    <div class="hero-content">
      <div class="hero-text">
        <div class="hero-badge animate-on-scroll">
          <span class="badge-dot"></span>
          Open to opportunities
        </div>

        <h1 class="animate-on-scroll">
          Hi, I'm <span class="gradient-text">Viral Limbani</span>
        </h1>

        <h2 class="hero-title animate-on-scroll">
          Full-Stack Software Developer
        </h2>

        <p class="hero-description animate-on-scroll">
          I build complete, production-ready web applications from frontend to backend.
          <span class="highlight">{{ totalExperience }}</span> of professional experience
          in the JavaScript ecosystem.
        </p>

        <div class="hero-actions animate-on-scroll">
          <button class="btn-primary-custom" (click)="goToProjects()">
            View My Work
          </button>
          <button class="btn-outline-custom" (click)="downloadResume()">
            Download Resume
          </button>
        </div>

        <div class="hero-social animate-on-scroll">
          <a href="https://github.com/viral-limbani" target="_blank" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://linkedin.com/in/viral-limbani" target="_blank" aria-label="LinkedIn">
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a href="mailto:virallimbani9033@gmail.com" aria-label="Email">
            <i class="fas fa-envelope"></i>
          </a>
        </div>
      </div>

      <div class="hero-visual animate-on-scroll">
        <div class="profile-wrapper">
          <div class="profile-ring">
            <div class="profile-image">
              <img
                src="assets/images/Viral-1.png"
                alt="Viral Limbani - Full-Stack Developer"
                loading="lazy"
              />
            </div>
          </div>
          <div class="floating-badge tech-badge-1">
            <i class="fab fa-angular"></i>
            Angular
          </div>
          <div class="floating-badge tech-badge-2">
            <i class="fab fa-node-js"></i>
            Node.js
          </div>
          <div class="floating-badge tech-badge-3">
            <i class="fas fa-database"></i>
            MongoDB
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Background decoration -->
  <div class="bg-decoration">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
  </div>
</section>
